<head>

<style>
/*
  Critera · EngineLite — גרסה מוקלת ונפרדת של אנימציית "מנוע ה-AI" (critera-engine-section.html, שנשארת כמו שהיא).
  לפי critera_animation_brief.md (18.10.2026), ושינויי לריסה: Credit request ← Deal details ← AI engine ← Credit file ← התאמה לגופי מימון, בFull anonymity.
  כ־11 שניות, פעם אחת כשנכנסת למסך, ונשארת על המצב הסופי. reduced motion: המצב הסופי מיד.
  דסקטופ: תרשים אופקי 1240×290. מתחת ל־768px: פריסה אנכית משלה.
*/
:root{
  --purple:#6F5EEA; --purple-soft:#8C7EEE; --tint:#F1EEFD;
  --ink:#241D4F; --ink-2:#5A5478; --surface:#FFFFFF; --border:#E5E1F6;
  --glow:rgba(111,94,234,.28); --ok:#3DBB82;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark; --ink:#F3F1FF; --ink-2:#B9B3DA; --surface:#1E1840; --border:#332B63; --tint:#2A2257; --glow:rgba(140,126,238,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark; --ink:#F3F1FF; --ink-2:#B9B3DA; --surface:#1E1840; --border:#332B63; --tint:#2A2257; --glow:rgba(140,126,238,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
#engine-lite{font-family:Rubik,"Segoe UI",Arial,sans-serif;color:var(--ink)}
#engine-lite svg{display:block;width:100%;height:auto;direction:ltr;overflow:visible}
#engine-lite svg text{font-family:Rubik,sans-serif;fill:var(--ink)}
.desk{max-width:1240px;margin:0 auto}
.mob{display:none;max-width:420px;margin:0 auto}
@media (max-width:767px){ .desk{display:none} .mob{display:block} }

/* ── shared pieces ── */
.card{fill:var(--surface);stroke:var(--border);stroke-width:1.5}
.ico{fill:none;stroke:var(--purple);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;transition:stroke .5s}
.line{fill:none;stroke:var(--purple-soft);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.flow{fill:none;stroke:var(--purple);stroke-width:9;stroke-linecap:round;stroke-dasharray:0 2;stroke-dashoffset:0;opacity:0} /* a zero dash with round caps: one dot */

/* everything starts hidden; .on is the finished picture, reached by transitions with their own delays (ms in --d) */
.req,.src,.fin,.file,.node,.nlabel,.ai{opacity:0}
.req{transform:translateY(-10px)}
.chk{opacity:0;transform:scale(.5);transform-origin:center;transform-box:fill-box}
.src{transform:translate(var(--sx,24px),var(--sy,0))}
.file{transform:scale(.92);transform-origin:center;transform-box:fill-box}
.node{transform:scale(.6);transform-origin:center;transform-box:fill-box}
.ai{transform:scale(.85);transform-origin:center;transform-box:fill-box}
.ready{opacity:0;transform:scale(.96);transform-origin:center;transform-box:fill-box}
.ready .tick{stroke-dasharray:1;stroke-dashoffset:1}

.on .req{opacity:1;transform:none;transition:opacity .5s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.on .src{opacity:1;transform:none;transition:opacity .6s ease var(--d),transform .8s cubic-bezier(.2,.8,.2,1) var(--d)}
.on .line{stroke-dashoffset:0;opacity:1;transition:stroke-dashoffset var(--len,.9s) cubic-bezier(.45,0,.25,1) var(--d),opacity .01s linear var(--d)}
.on .ai{opacity:1;transform:none;transition:opacity .6s ease .3s,transform .8s cubic-bezier(.2,.8,.2,1) .3s}
.on .file{opacity:1;transform:none;transition:opacity .6s ease 4.4s,transform .8s cubic-bezier(.2,.8,.2,1) 4.4s}
.on .file .frame{filter:drop-shadow(0 8px 22px var(--glow))}
.progress .track{fill:var(--tint)}
.progress .bar{fill:url(#gTile);transform:scaleX(0);transform-origin:right center;transform-box:fill-box} /* fills right to left, as Hebrew reads */
.on .progress .bar{transform:none;transition:transform 1.1s cubic-bezier(.45,0,.25,1) 4.8s}
.on .ready{opacity:1;transform:none;transition:opacity .35s ease 5.9s,transform .45s cubic-bezier(.2,.9,.3,1.3) 5.9s}
.on .ready .tick{stroke-dashoffset:0;transition:stroke-dashoffset .4s ease 6.15s}
.on .node{opacity:1;transform:none;transition:opacity .4s ease 6.2s,transform .5s cubic-bezier(.2,.8,.2,1) 6.2s}
.on .nlabel{opacity:1;transition:opacity .5s ease 6.35s}
/* the funders come in quietly at 6.2s; each lights and gets its tick (it sees the request) when its line reaches it */
.on .fin{opacity:1;transition:opacity .6s ease 6.2s}
.on .fin .chk{opacity:1;transform:none;transition:opacity .3s ease var(--d),transform .45s cubic-bezier(.2,.9,.3,1.3) var(--d)}
.on .fin .card{stroke:var(--purple-soft);filter:drop-shadow(0 0 10px var(--glow));transition:stroke .5s ease var(--d),filter .5s ease var(--d)}

/* the motion that comes and goes: only while playing, never in the still (reduced-motion) picture */
.on:not(.still) .flow{animation:flow .9s cubic-bezier(.45,0,.25,1) var(--d) var(--n,1) both}
@keyframes flow{0%{stroke-dashoffset:0;opacity:0}10%{opacity:1}88%{opacity:1}100%{stroke-dashoffset:-1;opacity:0}}
.ai .tile{fill:url(#gTile);filter:drop-shadow(0 6px 14px rgba(111,94,234,.35))}
.ai .halo{fill:var(--purple);opacity:.1}
.ai .pulse{fill:none;stroke:var(--purple-soft);stroke-width:2;opacity:0;transform-origin:center;transform-box:fill-box}
.ai .spark{transform-origin:center;transform-box:fill-box}
.on:not(.still) .ai .tile{animation:glow 2.6s ease-in-out 1.7s both}
@keyframes glow{0%,100%{filter:drop-shadow(0 6px 14px rgba(111,94,234,.35))}40%,70%{filter:drop-shadow(0 0 22px rgba(140,126,238,.9))}}
.on:not(.still) .ai .spark{animation:spin 2.4s cubic-bezier(.5,0,.2,1) 1.9s both}
@keyframes spin{to{transform:rotate(720deg)}}
.on:not(.still) .ai .pulse{animation:pulse 1.1s ease-out 2.1s 2 both}
@keyframes pulse{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}

.still *{transition:none!important;animation:none!important}
.label{font-size:17px}
.ttl{font-weight:700}
.sub{font-weight:500}
</style>

</head>

<script>
(function(){
  // plays once, the first time a third of it is on screen, and stays on the finished picture; reduced motion shows that picture at once
  const root = document.getElementById('engine-lite');
  const start = (still) => { if (still) root.classList.add('still'); root.classList.add('on'); };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) return start(true);
  const io = new IntersectionObserver((es) => { if (es[0].isIntersecting) { io.disconnect(); start(false); } }, { threshold: .35 });
  io.observe(root);
})();
</script>
