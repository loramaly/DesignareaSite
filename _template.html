<!DOCTYPE html>
<!--
  ============================================================
  BASE TEMPLATE  (_template.html)  -  the main template
  ============================================================
  This is the starting point for EVERY page on the site.
  Copy this file, rename it, set the <title>, and drop your
  content into the .frame-section below.

  It gives you the site frame, as-is:
      .page
        header            <- top menu bar
        .nav-overlay
        .frame-section    <- your content (repeat as needed)
        footer            <- bottom bar

  Rules:
   - All of the above stay DIRECT children of .page.
   - NO margin between them - the 2px purple frame must read
     as one continuous box, identical on every page.
   - Frame borders live only in css/styles.css under
     "===== SITE FRAME =====". Never redeclare them per page.

  Templates:
   - _template.html   BASE / MAIN  <- you are here
   - (planned) a CASE template, to be derived from
     case-aft/aft-timeline.html once that case study is finished.
  ============================================================
-->

<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<script>/* dark is the default - only the visitor's own choice switches it, and the
   attribute is set before first paint so the page never flashes the wrong theme */
(function(){try{var t=localStorage.getItem('lm-theme-v2');
document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}
catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>

<script>
/* returning to home from anywhere on the site: replay the normal hero entrance
   (portrait/text/chips/dice) like a fresh load, instead of showing a stale/settled page */
addEventListener('pageshow', () => {
  let fromSite = false;
  try { fromSite = document.referrer && new URL(document.referrer).origin === location.origin; } catch(e) {}
  if (!fromSite) return;
  document.body.classList.add('reanim-lock');
  void document.body.offsetWidth;
  document.body.classList.remove('reanim-lock');
});
</script>
</head>
