  <body>
    <div id="root"></div>
      <script>
      // Tab favicon: dark resting icon + the site logo's top-to-bottom bar flip, once on load and then every 60 seconds.
      // Google and crawlers read only the static <link rel="icon"> tags above;
      // this script changes the icon of the OPEN TAB only.
      (function () {
        var link = document.querySelector('link[rel="icon"][type="image/svg+xml"]');
        if (!link) return;
        // Browsers pick the PNG <link> whose size fits the tab best and ignore the SVG one,
        // so the open tab keeps only one icon link: the one this script animates.
        document.querySelectorAll('link[rel="icon"]').forEach(function (l) { if (l !== link) l.remove(); });
        var frames = [];
        for (var i = 0; i < 27; i++) frames.push('/favicon-anim/f' + ('0' + i).slice(-2) + '.png');
        var rest = '/favicon-anim/rest.png';
        frames.concat([rest]).forEach(function (src) { var im = new Image(); im.src = src; });
        function set(href) { link.setAttribute('type', 'image/png'); link.setAttribute('href', href); }
        function play() {
          var i = 0;
          var t = setInterval(function () {
            if (i >= frames.length) { clearInterval(t); set(rest); return; }
            set(frames[i++]);
          }, 40);
        }
        set(rest);
        setTimeout(play, 2000);
        setInterval(play, 60000);
      })();
    </script>
