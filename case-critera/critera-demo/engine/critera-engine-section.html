<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<!-- Embedded in the site via iframe: keep it out of search results on its own (indexifembedded lets Google count it as part of the page that embeds it). -->
<meta name="robots" content="noindex">
<meta name="googlebot" content="noindex, indexifembedded">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critera — סקשן מנוע ה-AI לניתוח עסקאות (גרסה סופית להטמעה)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=MuseoModerno:wght@500;600;700&display=swap">
<style>
:root{
  --purple:#6F5EEA; --purple-soft:#8C7EEE; --purple-deep:#4A3AB8;
  --ink:#241D4F; --ink-2:#5A5478; --bg:#FFFFFF; --surface:#FFFFFF; --border:#E5E1F6;
  --magenta:#AA3ACE; --pink:#F02FB8; --orange:#FFA411; --yellow:#FFDA3E;
  --glow:rgba(111,94,234,.28); --grid:rgba(111,94,234,.10); --shadow:0 10px 30px rgba(36,29,79,.08);
  --ok:#1FA971;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#F3F1FF; --ink-2:#B9B3DA; --bg:#14102B; --surface:#1E1840; --border:#332B63;
    --glow:rgba(140,126,238,.35); --grid:rgba(140,126,238,.14); --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#F3F1FF; --ink-2:#B9B3DA; --bg:#14102B; --surface:#1E1840; --border:#332B63;
  --glow:rgba(140,126,238,.35); --grid:rgba(140,126,238,.14); --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
#critera-engine{background:transparent;color:var(--ink);font-family:Rubik,"Segoe UI",Arial,sans-serif;direction:rtl;max-width:none;margin:0;overflow-x:auto}
.wrap{max-width:1480px;margin:0 auto}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--purple);font-weight:600;margin:0 0 8px}
h1{font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0 0 10px;text-wrap:balance;font-weight:700}
.lead{font-size:17px;color:var(--ink-2);max-width:62ch;margin:0 0 22px;line-height:1.6}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.btn{font:inherit;font-weight:500;font-size:14px;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer;transition:background .2s,border-color .2s}
.btn:hover{border-color:var(--purple-soft)}
.btn:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.btn.on{background:var(--purple);border-color:var(--purple);color:#fff}
.time{font-family:MuseoModerno,Rubik,sans-serif;font-weight:600;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;direction:ltr;min-width:80px;text-align:left}
.scrub{flex:1 1 220px;accent-color:var(--purple);direction:ltr;min-width:160px}
.stage{background:var(--surface);overflow-x:auto;position:relative}
.stage.blueprint{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
#critera-engine svg{display:block;min-width:1180px;width:100%;height:auto;direction:ltr}
#critera-engine svg text{font-family:Rubik,sans-serif;fill:var(--ink)}
#critera-engine svg .pill text,#critera-engine svg .cta text{fill:#fff}
.num{font-family:MuseoModerno,Rubik,sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
.muted{fill:var(--ink-2)!important}
.card{fill:var(--surface);stroke:var(--border);stroke-width:1.5}
.src .srcin{opacity:0;transform:translateX(14px);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
.src.vis .srcin{opacity:1;transform:none}
.src .box{fill:var(--surface);stroke:var(--border);stroke-width:1.5;transition:stroke .35s,filter .35s}
.src.on .box{stroke:var(--purple-soft);filter:drop-shadow(0 0 10px var(--glow))}
.src .dot{fill:var(--border);transition:fill .3s}
.src.on .dot{fill:var(--purple)}
.src .label{transition:fill .3s}
.src .label{fill:var(--ink-2)}
.src.on .label{fill:var(--ink)}
.path,.lpath{fill:none;stroke:var(--border);stroke-width:1.5;stroke-dasharray:3 6;stroke-linecap:round;opacity:0;transition:stroke .5s,stroke-width .5s,opacity .7s}
.path.vis,.lpath.vis{opacity:1}
.path.on,.lpath.on{stroke:var(--purple-soft);stroke-width:2;stroke-dasharray:none}
.engine .shell,.out .frame{fill:var(--surface);stroke:var(--purple-soft);stroke-width:2;transition:opacity .2s,x .8s cubic-bezier(.2,.8,.2,1),y .8s cubic-bezier(.2,.8,.2,1),width .8s cubic-bezier(.2,.8,.2,1),height .8s cubic-bezier(.2,.8,.2,1),rx .8s,filter .5s,stroke .4s}
.engine .shell{x:410px;y:310px;width:290px;height:0px;rx:26px;opacity:0}
.engine.open .shell{x:410px;y:110px;width:290px;height:400px;rx:26px;opacity:1}
.out .frame{x:125px;y:270px;width:80px;height:80px;rx:22px;stroke:var(--border)}
.out.on .frame{stroke:var(--purple-soft);filter:drop-shadow(0 0 14px var(--glow))}
.out.open .frame{x:20px;y:110px;width:290px;height:400px;rx:26px;stroke:var(--purple-soft)}
.ficon{transform-origin:165px 308px}
.closedc{opacity:1;transition:opacity .25s}
.open .closedc{opacity:0}
.openc{opacity:0;transition:opacity .3s .6s}
.open .openc{opacity:1}
.engine .stg{opacity:0;transition:opacity .4s}
.engine.open .stg{opacity:1}
.engine.open .stg[data-i="0"]{transition-delay:1.1s}.engine.open .stg[data-i="1"]{transition-delay:1.2s}.engine.open .stg[data-i="2"]{transition-delay:1.3s}.engine.open .stg[data-i="3"]{transition-delay:1.4s}.engine.open .stg[data-i="4"]{transition-delay:1.5s}
.engine .foot{opacity:0;transition:opacity .4s 1.45s}
.engine.open .foot{opacity:1}
.engine.on .shell{filter:drop-shadow(0 0 22px var(--glow))}
.stg .ring{fill:var(--surface);stroke:var(--border);stroke-width:1.5;transition:stroke .3s,fill .3s}
.stg .tick{fill:none;stroke:var(--purple);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .4s}
.stg .name{fill:var(--ink-2);transition:fill .3s}
.stg .track{fill:var(--border)}
.stg .fill{fill:var(--purple);transition:width .2s linear}
.stg.active .ring{stroke:var(--purple);fill:var(--surface)}
.stg.active .name{fill:var(--ink);font-weight:600}
.stg.done .ring{stroke:var(--purple);fill:var(--purple)}
.stg.done .tick{stroke:#fff;stroke-dashoffset:0}
.stg.done .name{fill:var(--ink)}
.scan{fill:none;stroke:var(--purple);stroke-width:2;stroke-opacity:.85;stroke-linecap:round}
.ai{opacity:0;transform:scale(.6);transform-origin:700px 310px;transition:opacity .4s,transform .6s cubic-bezier(.2,.8,.2,1)}
.ai.show{opacity:1;transform:none}
.ai .halo{fill:var(--purple);opacity:.08;transition:opacity .4s}
.ai.on .halo{opacity:.18}
.ai .tile{fill:url(#gTile);filter:drop-shadow(0 6px 14px rgba(111,94,234,.35));transition:filter .4s}
.ai.on .tile{filter:drop-shadow(0 0 14px rgba(140,126,238,.8))}
.ai .spark{transform-origin:0 0}
.ai.on .spark{animation:spinup 2.6s cubic-bezier(.15,.75,.25,1) forwards}
@keyframes spinup{from{transform:rotate(0)}to{transform:rotate(720deg)}}
.ai-title{font-family:Rubik,sans-serif;font-weight:700;font-size:20px;fill:var(--ink);opacity:0;transition:opacity .25s 0s}
.ai.open .ai-title{opacity:1;transition:opacity .45s .9s}
.ai:not(.on):not(.up) .tile{opacity:.72}
.ai .tile{transition:filter .4s,opacity .5s}

.lend .lbox{fill:var(--surface);stroke:var(--border);stroke-width:1.5;transition:stroke .4s,filter .4s}
.lend .lt{fill:var(--ink);transition:fill .4s}
.lend .ls{fill:var(--ink-2)}
.lend .chk{opacity:0;transform:scale(.6);transform-origin:12px 12px;transition:opacity .35s,transform .35s cubic-bezier(.2,.9,.3,1.4)}
.lend .chk rect{fill:#3DBB82}
.lend.match.hit .lbox{stroke:var(--purple-soft);filter:drop-shadow(0 0 10px var(--glow))}
.lend.match.hit .chk{opacity:1;transform:scale(1)}
.sending .lend:not(.match){opacity:.45}
.lend{transition:opacity .5s}
.particle{fill:var(--purple);opacity:0}
.particle.warm{fill:#D554FF}
.out .item{opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s}
.out .item.on{opacity:1;transform:none}
.out.ready .frame{filter:drop-shadow(0 0 16px var(--glow))}
.bullet{fill:var(--purple)}
.pill{fill:var(--purple);}
.pill text{fill:#fff}
.simbar{fill:var(--purple-soft)}
.simbar.b2{fill:var(--magenta)}.simbar.b3{fill:var(--pink)}
.cta .btn-inner{transform-origin:165px 457px;transition:transform .15s}
.cta.press .btn-inner{transform:scale(.95)}
.cta rect{fill:var(--purple);transition:fill .35s}
.cta text{fill:#fff}
.cta .done-lbl{opacity:0;transition:opacity .3s}
.cta.done rect{fill:#3DBB82}
.cta.done .lbl{opacity:0}
.cta.done .done-lbl{opacity:1}
.cta .lbl{transition:opacity .2s}
.hand{opacity:0;transform:translate(225px,520px);transition:opacity .3s,transform .7s cubic-bezier(.2,.8,.2,1)}
.hand.in{opacity:1;transform:translate(155px,452px)}
.hand.press{transform:translate(155px,456px) scale(.92)}
.hand.out{opacity:0;transform:translate(115px,500px)}
.seg1{fill:var(--purple)}.seg2{fill:var(--magenta)}.seg3{fill:var(--orange)}
.bp{opacity:0;transition:opacity .3s;pointer-events:none}
.blueprint .bp{opacity:1}
.bp .dim{fill:none;stroke:var(--purple);stroke-width:1;stroke-dasharray:5 4;opacity:.7}
.bp .callout circle{fill:var(--purple)}
.bp .callout text{fill:#fff;font-family:MuseoModerno,sans-serif;font-weight:700}
.bp .note{fill:var(--purple);font-size:12px;font-weight:500}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:18px}
.leg{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.leg .n{width:30px;height:30px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-family:MuseoModerno,sans-serif;font-weight:700;font-size:14px}
.leg h3{margin:0 0 4px;font-size:15px}
.leg p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.55}
.leg .t{display:inline-block;margin-top:6px;font-family:MuseoModerno,sans-serif;font-size:12px;color:var(--purple);direction:ltr;font-weight:600}
.spec{margin-top:26px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px}
.spec h2{font-size:18px;margin:0 0 8px}
.spec p{margin:0 0 8px;color:var(--ink-2);font-size:14.5px;line-height:1.6;max-width:75ch}
.spec code{font-family:MuseoModerno,monospace;font-size:13px;background:var(--bg);padding:1px 6px;border-radius:6px;direction:ltr;display:inline-block}
@media (prefers-reduced-motion: reduce){
  .src .box,.path,.stg,.out .item,.out .frame{transition:none!important}
  .ai.on .spark{animation:none!important}
}
.fin-base{stroke:var(--border);stroke-width:1.2}.fin-area{fill:var(--purple-soft);opacity:0;transition:opacity .4s}.fin-line{fill:none;stroke:var(--purple);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}.fin-dot{fill:#F02FB8;opacity:0;transition:opacity .3s}
</style>
</head>
<body>
<!--
  קריטרה · סקשן "מנוע ה-AI" · גרסה סופית (v28, 24.9.2026)
  קנבס 1490×490 · לולאה 24 שניות · רקע לבן · SVG + CSS + JS, בלי ספריות.
  להטמעה כמו שהוא: לא לשנות קואורדינטות, צבעים, טקסטים, תזמונים או סדר אלמנטים.
  שונה באתר בטקסט בלבד (15.10.2026, לבקשת איליה: גם השקעה, לא רק מימון): "תיק אשראי" ← "תיק אשראי / השקעה", קופסת Family Office ← "משקיע כשיר" (ביחיד, כמו שאר הקופסאות), "יוצא למלווים" ← "יוצא לגופים". שום דבר אחר לא שונה.
-->
<div id="critera-engine">
  <svg viewBox="-50 60 1490 490" id="svg" aria-label="שרטוט מנוע ה-AI של קריטרה לניתוח עסקאות">
    <defs>
      <linearGradient id="gPink" x1="0" x2="1"><stop offset="0" stop-color="#FF00C8"/><stop offset="1" stop-color="#FF965D"/></linearGradient>
      <clipPath id="shellClip"><rect x="410" y="110" width="290" height="400" rx="26"/></clipPath>
      <linearGradient id="gScan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--purple)" stop-opacity="0"/><stop offset="1" stop-color="var(--purple)" stop-opacity=".22"/></linearGradient>
      <linearGradient id="gTile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7A5CF5"/><stop offset="1" stop-color="#B043D9"/></linearGradient>
    </defs>
    <g id="shift" transform="translate(300,0)">

    <!-- ===== column titles ===== -->

    <!-- ===== paths: sources -> engine ===== -->
    <g id="paths">
      <path class="path" id="p0" d="M 956 120 C 886 120, 826 302, 756 302"/>
      <path class="path" id="p1" d="M 956 192 C 886 192, 826 306, 756 306"/>
      <path class="path" id="p2" d="M 956 264 C 886 264, 826 310, 756 310"/>
      <path class="path" id="p3" d="M 956 336 C 886 336, 826 314, 756 314"/>
      <path class="path" id="p4" d="M 956 408 C 886 408, 826 318, 756 318"/>
      <path class="path" id="p5" d="M 956 480 C 886 480, 826 322, 756 322"/>
      <path class="path" id="pOut" d="M 716 310 L 181 310"/>
      <path id="p0p" d="M 956 120 C 886 120, 826 302, 756 302" fill="none" stroke="none"/>
      <path id="p1p" d="M 956 192 C 886 192, 826 306, 756 306" fill="none" stroke="none"/>
      <path id="p2p" d="M 956 264 C 886 264, 826 310, 756 310" fill="none" stroke="none"/>
      <path id="p3p" d="M 956 336 C 886 336, 826 314, 756 314" fill="none" stroke="none"/>
      <path id="p4p" d="M 956 408 C 886 408, 826 318, 756 318" fill="none" stroke="none"/>
      <path id="p5p" d="M 956 480 C 886 480, 826 322, 756 322" fill="none" stroke="none"/>
      <path id="pOutp" d="M 426 310 L 326 310" fill="none" stroke="none"/>
    </g>
    <g id="lendPaths">
      <path class="lpath match" id="lp0" d="M 181 310 L 36 310 C -50 310, -50 126, -130 126"/>
      <path class="lpath match" id="lp1" d="M 181 310 L 36 310 C -50 310, -50 214, -130 214"/>
      <path class="lpath" id="lp2" d="M 181 310 L 36 310 C -50 310, -50 302, -130 302"/>
      <path class="lpath match" id="lp3" d="M 181 310 L 36 310 C -50 310, -50 390, -130 390"/>
      <path class="lpath" id="lp4" d="M 181 310 L 36 310 C -50 310, -50 478, -130 478"/>
      <path id="lp0p" d="M 36 310 C -50 310, -50 126, -130 126" fill="none" stroke="none"/>
      <path id="lp1p" d="M 36 310 C -50 310, -50 214, -130 214" fill="none" stroke="none"/>
      <path id="lp3p" d="M 36 310 C -50 310, -50 390, -130 390" fill="none" stroke="none"/>
    </g>


    <!-- ===== sources (right) ===== -->
    <g id="sources">
      <g class="src" transform="translate(956,94)"><g class="srcin"><rect class="box" width="164" height="52" rx="14"/><text class="label" x="147" y="32" text-anchor="end" font-size="17">מסמכי הבקשה</text></g></g>
      <g class="src" transform="translate(956,166)"><g class="srcin"><rect class="box" width="164" height="52" rx="14"/><text class="label" x="147" y="32" text-anchor="end" font-size="17">רשם החברות</text></g></g>
      <g class="src" transform="translate(956,238)"><g class="srcin"><rect class="box" width="164" height="52" rx="14"/><text class="label" x="147" y="32" text-anchor="end" font-size="17">נסח טאבו</text></g></g>
      <g class="src" transform="translate(956,310)"><g class="srcin"><rect class="box" width="164" height="52" rx="14"/><text class="label" x="147" y="32" text-anchor="end" font-size="17">מס שבח</text></g></g>
      <g class="src" transform="translate(956,382)"><g class="srcin"><rect class="box" width="164" height="52" rx="14"/><text class="label" x="147" y="32" text-anchor="end" font-size="17">בנק ישראל</text></g></g>
      <g class="src" transform="translate(956,454)"><g class="srcin"><rect class="box" width="164" height="52" rx="14"/><text class="label" x="147" y="32" text-anchor="end" font-size="17">פרסומים ופסקי דין</text></g></g>
    </g>

    <!-- ===== AI pass-through tile (between sources and engine) ===== -->
    <g transform="translate(16,0)">
    <!-- ===== engine panel (opens under the AI tile) ===== -->
    <g class="engine" id="engine">
      <rect class="shell"/>
      <g class="openc">
        <g class="stg" data-i="0" transform="translate(0,210)">
          <circle class="ring" cx="653" cy="0" r="11"/><path class="tick" d="M 647.5 0 L 651.5 4 L 658.5 -3.5"/>
          <text class="name" x="633" y="5" text-anchor="end" font-size="17">אוסף</text>
          <rect class="track" x="442" y="-2" width="60" height="4" rx="2"/><rect class="fill" x="442" y="-2" width="0" height="4" rx="2"/>
        </g>
        <g class="stg" data-i="1" transform="translate(0,268)">
          <circle class="ring" cx="653" cy="0" r="11"/><path class="tick" d="M 647.5 0 L 651.5 4 L 658.5 -3.5"/>
          <text class="name" x="633" y="5" text-anchor="end" font-size="17">מנתח</text>
          <rect class="track" x="442" y="-2" width="60" height="4" rx="2"/><rect class="fill" x="442" y="-2" width="0" height="4" rx="2"/>
        </g>
        <g class="stg" data-i="2" transform="translate(0,326)">
          <circle class="ring" cx="653" cy="0" r="11"/><path class="tick" d="M 647.5 0 L 651.5 4 L 658.5 -3.5"/>
          <text class="name" x="633" y="5" text-anchor="end" font-size="17">מעריך סיכון</text>
          <rect class="track" x="442" y="-2" width="60" height="4" rx="2"/><rect class="fill" x="442" y="-2" width="0" height="4" rx="2"/>
        </g>
        <g class="stg" data-i="3" transform="translate(0,384)">
          <circle class="ring" cx="653" cy="0" r="11"/><path class="tick" d="M 647.5 0 L 651.5 4 L 658.5 -3.5"/>
          <text class="name" x="633" y="5" text-anchor="end" font-size="17">מנבא מחיר</text>
          <rect class="track" x="442" y="-2" width="60" height="4" rx="2"/><rect class="fill" x="442" y="-2" width="0" height="4" rx="2"/>
        </g>
        <g class="stg" data-i="4" transform="translate(0,442)">
          <circle class="ring" cx="653" cy="0" r="11"/><path class="tick" d="M 647.5 0 L 651.5 4 L 658.5 -3.5"/>
          <text class="name" x="633" y="5" text-anchor="end" font-size="17">בונה סימולציות</text>
          <rect class="track" x="442" y="-2" width="60" height="4" rx="2"/><rect class="fill" x="442" y="-2" width="0" height="4" rx="2"/>
        </g>
        <g id="scanG" clip-path="url(#shellClip)" style="opacity:0">
          <rect id="scanFade" x="410" y="130" width="290" height="70" fill="url(#gScan)"/>
          <line class="scan" x1="410" y1="200" x2="700" y2="200"/>
        </g>
      </g>
    </g>

    <!-- ===== AI tile (the engine itself) ===== -->
    <g class="ai" id="ai">
      <g class="tilewrap">
      <rect class="halo" x="648" y="258" width="104" height="104" rx="30"/>
      <rect class="tile" x="660" y="270" width="80" height="80" rx="22"/>
      <g class="icon" transform="translate(700,310)">
        <path class="spark" d="M 0 -20 C 2.2 -7.5, 7.5 -2.2, 20 0 C 7.5 2.2, 2.2 7.5, 0 20 C -2.2 7.5, -7.5 2.2, -20 0 C -7.5 -2.2, -2.2 -7.5, 0 -20 Z" fill="#fff"/>
      </g>
      </g>
      <text class="ai-title" x="640" y="156" text-anchor="start" style="direction:rtl;unicode-bidi:isolate">מנוע ניתוח AI</text>
    </g>

    <!-- ===== output card (left) ===== -->
    <g class="out" id="out">
      <rect class="frame"/>
      <g class="item" id="o-title">
        <text x="234" y="155" text-anchor="end" font-size="20" font-weight="700">תיק אשראי / השקעה</text>
      </g>

      <g class="item" id="o-rating">
        <text x="274" y="231" text-anchor="end" font-size="17">מדד העסקה</text>
        <g class="pill" transform="translate(52,210)"><rect width="64" height="30" rx="15"/><text class="num" x="32" y="21" text-anchor="middle" font-size="17">74</text></g>
      </g>

      <g class="item" id="o-price">
        <text x="274" y="287" text-anchor="end" font-size="17">ניתוח פיננסי</text>
        <g id="finChart" transform="translate(52,270) scale(1)"><line class="fin-base" x1="0" y1="22" x2="100" y2="22"/><path class="fin-area" id="finArea" d="M 0 18 L 18 13 L 36 15 L 54 8 L 72 10 L 100 2 L 100 22 L 0 22 Z"/><path class="fin-line" id="finLine" d="M 0 18 L 18 13 L 36 15 L 54 8 L 72 10 L 100 2" pathLength="1"/><circle class="fin-dot" id="finDot" cx="100" cy="2" r="3.2"/></g>
      </g>

      <g class="item" id="o-sim">
        <text x="274" y="343" text-anchor="end" font-size="17">סימולציות</text>
        <g transform="translate(52,348) scale(1,-1)">
          <rect class="simbar b1" id="sb1" x="0" y="0" width="22" height="0" rx="3"/>
          <rect class="simbar b2" id="sb2" x="30" y="0" width="22" height="0" rx="3"/>
          <rect class="simbar b3" id="sb3" x="60" y="0" width="22" height="0" rx="3"/>
        </g>
      </g>

      <g class="item" id="o-deal">
        <text x="274" y="401" text-anchor="end" font-size="17">מבנה עסקה</text>
        <g transform="translate(52,388)">
          <rect class="seg1" x="0" y="0" width="0" height="12" rx="3" id="sg1"/>
          <rect class="seg2" x="0" y="0" width="0" height="12" rx="3" id="sg2"/>
          <rect class="seg3" x="0" y="0" width="0" height="12" rx="3" id="sg3"/>
        </g>
      </g>

      <g class="item cta" id="o-cta">
        <g class="btn-inner">
          <rect x="52" y="434" width="226" height="46" rx="23"/>
          <text class="lbl" x="165" y="463" text-anchor="middle" font-size="16" font-weight="600">פתוח לבדיקה</text>
          <g class="done-lbl">
            <g transform="translate(223,446)"><path d="M 4 12 l 5 5 L 20 6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
            <text x="215" y="463" text-anchor="start" style="direction:rtl;unicode-bidi:isolate" font-size="15" font-weight="600">אושר · יוצא לגופים</text>
          </g>
        </g>
        <g class="hand" id="hand">
          <path d="M 12 0 v 14 l -4 -3 c -2 -1.5 -4.5 0.5 -3 2.5 l 8 10 c 1 1.2 2.5 2 4 2 h 7 c 3 0 5 -2 5.5 -5 l 1.5 -8 c 0.5 -2.5 -2.5 -4 -4 -2 M 12 14 v -3 c 0 -2 4 -2 4 0 v 3 M 16 13 v -2 c 0 -2 4 -2 4 0 v 3" fill="#fff" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- ===== lenders (far left) ===== -->
    <g id="lenders">
      <g class="lend match" transform="translate(-330,94)">
        <rect class="lbox" width="200" height="64" rx="14"/>
        <text class="lt" x="184" y="26" text-anchor="end" font-size="17" font-weight="600">בנק מסחרי</text>
        <text class="ls" x="184" y="51" text-anchor="start" style="direction:rtl;unicode-bidi:isolate" font-size="17">ליווי בנייה · מרכז</text>
        <g transform="translate(14,20)"><g class="chk"><rect width="24" height="24" rx="6"/><path d="M 6 12 l 4.5 4.5 L 18 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g>
      </g>
      <g class="lend match" transform="translate(-330,182)">
        <rect class="lbox" width="200" height="64" rx="14"/>
        <text class="lt" x="184" y="26" text-anchor="end" font-size="17" font-weight="600">קרן חוב</text>
        <text class="ls" x="184" y="51" text-anchor="start" style="direction:rtl;unicode-bidi:isolate" font-size="17">מזנין · עד 25M</text>
        <g transform="translate(14,20)"><g class="chk"><rect width="24" height="24" rx="6"/><path d="M 6 12 l 4.5 4.5 L 18 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g>
      </g>
      <g class="lend" transform="translate(-330,270)">
        <rect class="lbox" width="200" height="64" rx="14"/>
        <text class="lt" x="184" y="26" text-anchor="end" font-size="17" font-weight="600">גוף מוסדי</text>
        <text class="ls" x="184" y="51" text-anchor="start" style="direction:rtl;unicode-bidi:isolate" font-size="17">נדל״ן מניב בלבד</text>
        <g transform="translate(14,20)"><g class="chk"><rect width="24" height="24" rx="6"/><path d="M 6 12 l 4.5 4.5 L 18 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g>
      </g>
      <g class="lend match" transform="translate(-330,358)">
        <rect class="lbox" width="200" height="64" rx="14"/>
        <text class="lt" x="184" y="26" text-anchor="end" font-size="17" font-weight="600">משקיע כשיר</text>
        <text class="ls" x="184" y="51" text-anchor="start" style="direction:rtl;unicode-bidi:isolate" font-size="17">Family Office · הון</text>
        <g transform="translate(14,20)"><g class="chk"><rect width="24" height="24" rx="6"/><path d="M 6 12 l 4.5 4.5 L 18 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g>
      </g>
      <g class="lend" transform="translate(-330,446)">
        <rect class="lbox" width="200" height="64" rx="14"/>
        <text class="lt" x="184" y="26" text-anchor="end" font-size="17" font-weight="600">גוף חוץ־בנקאי</text>
        <text class="ls" x="184" y="51" text-anchor="start" style="direction:rtl;unicode-bidi:isolate" font-size="17">הון חוזר · ייבוא</text>
        <g transform="translate(14,20)"><g class="chk"><rect width="24" height="24" rx="6"/><path d="M 6 12 l 4.5 4.5 L 18 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g>
      </g>
    </g>

    <!-- ===== file icon (rises into the card header) ===== -->
    <g class="ficon" id="ficon">
      <g transform="translate(165,308) scale(1.7) translate(-12,-10)" fill="none" stroke="var(--purple)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="14" rx="2" vector-effect="non-scaling-stroke"/>
        <path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" vector-effect="non-scaling-stroke"/>
        <path d="M22 13a18.15 18.15 0 0 1-20 0" vector-effect="non-scaling-stroke"/>
        <circle cx="12" cy="12.4" r="1.5" fill="var(--purple)" stroke="none"/>
      </g>
    </g>

    </g>
    <!-- ===== particles ===== -->
    <g id="particles"></g>

    </g>
  </svg>
</div>
<script>
(function(){
  const DUR = 24000;
  const HOLD = 2000;            // everything closed, dashed lines only
  const CLOSE_T = 18400;       // everything folds back, then loop (was 22400; the engine and file columns run faster)
  const svg = document.getElementById('svg');
  const srcs = [...document.querySelectorAll('.src')];
  const paths = [0,1,2,3,4,5].map(i=>document.getElementById('p'+i));
  const pOut = document.getElementById('pOut');
  const stgs = [...document.querySelectorAll('.stg')];
  const pOutp=document.getElementById('pOutp');
  const ppaths=[0,1,2,3,4,5].map(i=>document.getElementById('p'+i+'p'));
  const cta=document.getElementById('o-cta'), hand=document.getElementById('hand');
  const allLines=[...document.querySelectorAll('.path,.lpath')];
  const tilewrap=document.querySelector('.tilewrap');
  const ficon=document.getElementById('ficon');
  const SRC_Y=[120,192,264,336,408,480], END_Y=[302,306,310,314,318,322];
  const RISE_T=HOLD+900, RISE_LEN=800, RISE_DY=176;
  const easeOut=x=>1-Math.pow(1-x,3);
  const ai = document.getElementById('ai');
  const scanG = document.getElementById('scanG'), scanFade=document.getElementById('scanFade'), scanLine=scanG.querySelector('.scan');
  const engine = document.getElementById('engine');
  const out = document.getElementById('out');
  const partsG = document.getElementById('particles');
  const finLine = document.getElementById('finLine'), finArea = document.getElementById('finArea'), finDot = document.getElementById('finDot'); // the financial analysis' small chart (was the price range)
  const items = {title:'o-title',rating:'o-rating',price:'o-price',sim:'o-sim',deal:'o-deal',cta:'o-cta'};
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ----- timeline (ms) -----
  const SRC_START = HOLD, SRC_STAG = 350;
  const STAGE_START = HOLD+2500, STAGE_LEN = 1400;   // 5 stages -> ends 9500 after HOLD (was 2200 each)
  const stageT = i => STAGE_START + i*STAGE_LEN;
  const CTA_T = HOLD+9900;
  const SEND_T = HOLD+11700; // file goes out to lenders

  // particles: sources -> engine
  const parts = [];
  for(let s=0;s<6;s++){
    for(let k=0;k<4;k++){
      const st=SRC_START+200+s*SRC_STAG+k*260;
      parts.push({path:ppaths[s], start:st, len:640, warm:false});
    }
  }
  // result particles: engine -> card (after stages 2,3,4)
  [2,3,4].forEach(i=>parts.push({path:pOutp, start:stageT(i)+STAGE_LEN-380, len:400, warm:true}));
  // file -> matching lenders
  const lendEls=[...document.querySelectorAll('.lend')], lpaths=[0,1,2,3,4].map(i=>document.getElementById('lp'+i));
  const svgRoot=document.getElementById('svg');
  const MATCH=[0,1,3];
  MATCH.forEach((i,k)=>{ const pp=document.getElementById('lp'+i+'p'); for(let n=0;n<3;n++) parts.push({path:pp, start:SEND_T+200+k*300+n*180, len:600, warm:true, lender:i}); });
  parts.forEach(p=>{
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r', p.warm?6:4.5); c.setAttribute('class','particle'+(p.warm?' warm':''));
    partsG.appendChild(c); p.el=c; p.L=p.path.getTotalLength();
  });

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;
  const fmt=n=>(n/1000).toFixed(2);

  function render(tRaw){
    const closing = tRaw>=CLOSE_T; const t = closing ? 0 : tRaw;
    // sources
    srcs.forEach((s,i)=>{ const on=t>=SRC_START+i*SRC_STAG; s.classList.toggle('on',on); paths[i].classList.toggle('on',on); s.classList.toggle('vis', closing || tRaw>=i*110); });
    allLines.forEach((l,i)=>l.classList.toggle('vis', closing || tRaw>=300+i*90));
    // CTA: hand comes in, presses, button turns green
    hand.classList.toggle('in', t>=CTA_T+500 && t<CTA_T+1500);
    hand.classList.toggle('press', t>=CTA_T+1100 && t<CTA_T+1500);
    hand.classList.toggle('out', t>=CTA_T+1500);
    cta.classList.toggle('press', t>=CTA_T+1100 && t<CTA_T+1300);
    cta.classList.toggle('done', t>=CTA_T+1300);
    // engine
    engine.classList.toggle('on', t>=STAGE_START && t<CTA_T+1000);
    // tile rises and the source lines follow it
    const rp=easeOut(clamp((t-RISE_T)/RISE_LEN,0,1)), dy=RISE_DY*rp;
    tilewrap.style.transform='translateY('+(-dy)+'px)';
    ai.classList.toggle('up', t>=RISE_T);
    for(let i=0;i<6;i++){ const a=SRC_Y[i], b=END_Y[i]-dy; const d='M 956 '+a+' C 886 '+a+', 826 '+b.toFixed(1)+', 756 '+b.toFixed(1); paths[i].setAttribute('d',d); ppaths[i].setAttribute('d',d); }
    engine.classList.toggle('open', t>=RISE_T); ai.classList.toggle('open', t>=RISE_T);
    const F_T=stageT(2)-900, fp=easeOut(clamp((t-F_T)/RISE_LEN,0,1));
    ficon.style.transform='translate('+(95*fp)+'px,'+(-161.5*fp)+'px) scale('+(1-0.25*fp)+')';
    out.classList.toggle('on', t>=F_T-300 && t<CTA_T+1500);
    out.classList.toggle('open', t>=F_T);
    pOut.classList.toggle('on', t>=stageT(2));
    stgs.forEach((g,i)=>{
      const a=stageT(i), p=clamp((t-a)/STAGE_LEN,0,1);
      g.classList.toggle('active', t>=a && p<1);
      g.classList.toggle('done', p>=1);
      g.querySelector('.fill').setAttribute('width', (60*p).toFixed(1));
    });
    // scan line during "מנתח"
    if(t>=stageT(1) && t<stageT(2)){ const p=(t-stageT(1))/STAGE_LEN, y=185+300*p; scanG.style.opacity=1; scanLine.setAttribute('y1',y); scanLine.setAttribute('y2',y); scanFade.setAttribute('y',y-70);} else scanG.style.opacity=0;
    // AI tile lights up while data passes through it
    ai.classList.toggle('on', t>=SRC_START+200 && t<stageT(1)+600);
    ai.classList.toggle('show', closing || tRaw>=150);
    // output card
    out.classList.toggle('ready', t>=CTA_T);
    document.getElementById(items.title).classList.toggle('on', t>=stageT(2)+100);
    const doneAt=i=>stageT(i)+STAGE_LEN;
    document.getElementById(items.rating).classList.toggle('on', t>=doneAt(2));
    document.getElementById(items.price).classList.toggle('on', t>=doneAt(3));
    document.getElementById(items.sim).classList.toggle('on', t>=doneAt(4)-200);
    document.getElementById(items.deal).classList.toggle('on', t>=doneAt(4)+250);
    document.getElementById(items.cta).classList.toggle('on', t>=CTA_T);
    // price count-up
    const pp=clamp((t-doneAt(3))/900,0,1); finLine.style.strokeDashoffset=String(1-ease(pp)); finArea.style.opacity=String(0.18*ease(pp)); finDot.style.opacity=pp>=1?'1':'0';
    // sim bars
    const sp=clamp((t-(doneAt(4)-200))/800,0,1);
    document.getElementById('sb1').setAttribute('height',(28*ease(sp)).toFixed(1));
    document.getElementById('sb2').setAttribute('height',(20*ease(clamp(sp*1.15-.1,0,1))).toFixed(1));
    document.getElementById('sb3').setAttribute('height',(34*ease(clamp(sp*1.3-.3,0,1))).toFixed(1));
    // deal segments (total 120px: 55% / 30% / 15%)
    const dp=ease(clamp((t-(doneAt(4)+250))/700,0,1)); const W=100*dp;
    const w1=Math.min(W,55), w2=clamp(W-55,0,30), w3=clamp(W-85,0,15);
    const sg1=document.getElementById('sg1'), sg2=document.getElementById('sg2'), sg3=document.getElementById('sg3');
    sg1.setAttribute('width',w1); sg2.setAttribute('x',58); sg2.setAttribute('width',w2); sg3.setAttribute('x',91); sg3.setAttribute('width',w3);
    // sending to lenders
    svgRoot.classList.toggle('sending', t>=SEND_T);
    MATCH.forEach((i,k)=>{ lpaths[i].classList.toggle('on', t>=SEND_T+200+k*300); lendEls[i].classList.toggle('hit', t>=SEND_T+200+k*300+600); });
    // particles
    parts.forEach(p=>{
      const u=(t-p.start)/p.len;
      if(u<0||u>1){ p.el.style.opacity=0; return; }
      const pt=p.path.getPointAtLength(ease(u)*p.L);
      p.el.setAttribute('cx',pt.x); p.el.setAttribute('cy',pt.y);
      p.el.style.opacity = u<.1?u*10 : u>.8?(1-u)/.2 : 1;
    });
  }

  // ----- player (site): autoplay in a loop while the section is on screen -----
  let playing=false, t0=0, offset=reduced?DUR-1:HOLD-300;
  function now(){ return playing ? (offset + (performance.now()-t0)*1.3) % DUR : offset; }
  function frame(){ render(now()); if(playing) requestAnimationFrame(frame); }
  function play(){ if(playing||reduced) return; playing=true; t0=performance.now(); requestAnimationFrame(frame); }
  function pause(){ if(!playing) return; offset=now(); playing=false; }
  render(offset);
  const stage=document.getElementById('critera-engine');
  if('IntersectionObserver' in window){
    new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?play():pause()),{threshold:.25}).observe(stage);
  } else play();
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); else if(stage.getBoundingClientRect().top<innerHeight) play(); });
})();
</script>
</body>
</html>
